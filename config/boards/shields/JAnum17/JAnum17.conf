CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Forces the typing channel to stay open even if the OS gets confused
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Boosts the Bluetooth transmission power to max (+8dBm) for stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enables an experimental ZMK feature that resolves connection drops
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
